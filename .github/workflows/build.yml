name: Build
on: [push, workflow_dispatch]
jobs:
  build-python-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build EXE
        run: |
          Invoke-WebRequest -Uri https://huggingface.co/renikud/renikud/resolve/main/model.onnx -OutFile model.onnx
          pip install renikud-onnx onnxruntime fastapi uvicorn pyinstaller
          pyinstaller --onefile --add-data "model.onnx;." renikud_service.py -n renikud_service_x64.exe --clean
      - uses: actions/upload-artifact@v4
        with:
          name: renikud-exe
          path: dist/renikud_service_x64.exe
